name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify production API health and browser CORS
        env:
          API_ORIGIN: https://yomart-api.onrender.com
          STOREFRONT_ORIGIN: https://yomart.onrender.com
          ADMIN_ORIGIN: https://yomart-admin.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const api = process.env.API_ORIGIN;
          const response = await fetch(`${api}/health`, { headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' } });
          const payload = await response.json();
          if (!response.ok || payload.success !== true ||
              payload.data?.environment !== 'production' ||
              payload.data?.database !== 'connected' ||
              payload.data?.imageStorage !== 'cloudinary' ||
              payload.data?.privatePaymentProofStorage !== 'cloudinary-authenticated') {
            throw new Error(`Production health check failed: HTTP ${response.status}; ${JSON.stringify(payload)}`);
          }
          console.log('Production health PASS', JSON.stringify(payload.data));
          const catalogResponse = await fetch(`${api}/products`, { headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' } });
          const catalog = await catalogResponse.json();
          if (!catalogResponse.ok || !Array.isArray(catalog.data) || catalog.data.length === 0) {
            throw new Error(`Production catalog check failed: HTTP ${catalogResponse.status}`);
          }
          for (const product of catalog.data) {
            for (const field of ['price', 'offerPrice', 'quantity', 'catalogSource', 'createdBy']) {
              if (Object.hasOwn(product, field)) throw new Error(`Public preview catalog leaked ${field} for product ${product._id}`);
            }
          }
          const detailResponse = await fetch(`${api}/products/${catalog.data[0]._id}`, { headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' } });
          const detail = await detailResponse.json();
          if (!detailResponse.ok || !detail.data) throw new Error('Production product detail check failed');
          for (const field of ['price', 'offerPrice', 'quantity', 'catalogSource', 'createdBy']) {
            if (Object.hasOwn(detail.data, field)) throw new Error(`Public product detail leaked ${field}`);
          }
          console.log('Public preview catalog PASS', catalog.data.length, 'products; synthetic prices and stock omitted');
          for (const origin of [process.env.STOREFRONT_ORIGIN, process.env.ADMIN_ORIGIN]) {
            const preflight = await fetch(`${api}/users/login`, {
              method: 'OPTIONS',
              headers: {
                Origin: origin,
                'Access-Control-Request-Method': 'POST',
                'Access-Control-Request-Headers': 'authorization,content-type',
              },
            });
            const allowed = preflight.headers.get('access-control-allow-origin');
            if (preflight.status !== 204 || allowed !== origin) {
              throw new Error(`CORS preflight failed for ${origin}: HTTP ${preflight.status}, allow-origin=${allowed}`);
            }
            console.log('CORS preflight PASS', origin);
          }
          NODE
